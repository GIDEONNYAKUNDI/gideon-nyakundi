# BEGIN Nyakundi 2027 security (managed by ops/install-htaccess.sh; edits inside this block are replaced on every deploy)
Options -Indexes
ServerSignature Off
<IfModule mod_headers.c>
  Header always set Strict-Transport-Security "max-age=31536000"
  Header always set X-Content-Type-Options "nosniff"
  Header always set X-Frame-Options "SAMEORIGIN"
  Header always set Referrer-Policy "strict-origin-when-cross-origin"
  Header always set Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()"
  Header always set Cross-Origin-Opener-Policy "same-origin"
  Header always unset X-Powered-By
  Header unset X-Powered-By
</IfModule>
# Never serve hidden files, notes, configuration, backups, data exports or scripts
<FilesMatch "(^\.(?!well-known)|\.(md|yml|yaml|sql|sqlite|db|log|bak|old|orig|swp|ini|conf|sh|csv|xlsx|xls|env|dist)$|~$)">
  Require all denied
</FilesMatch>
RedirectMatch 404 /\.git(/|$)
RedirectMatch 404 ^/ops(/|$)
# END Nyakundi 2027 security
